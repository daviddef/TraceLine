name: TraceLine
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# The Google Mobile Ads SDK. Resolving this needs network access, so a build in a
# sandbox that cannot fetch it will fail here — that is expected; it resolves in a normal
# Xcode build. Its presence is what turns ads on (AdManager.isEnabled follows
# canImport(GoogleMobileAds)).
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"

targets:
  TraceLine:
    type: application
    platform: iOS
    sources:
      - path: TraceLine
        excludes:
          - Resources/TraceLine.entitlements
    # An explicit Info.plist (rather than GENERATE_INFOPLIST_FILE) because AdMob needs
    # custom keys — GADApplicationIdentifier and the SKAdNetworkItems list — that the
    # generated plist cannot carry.
    info:
      path: TraceLine/Info.plist
      properties:
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleDisplayName: TraceLine
        # No encryption beyond Apple's — skips the export-compliance question each upload.
        ITSAppUsesNonExemptEncryption: false
        # Required by the Google Mobile Ads SDK; the app crashes on start without it.
        GADApplicationIdentifier: ca-app-pub-4156851882993001~8627606652
        # Ad-attribution networks. Google's own first; this is a common subset — paste the
        # full current list from AdMob's "Update your SKAdNetworkItems" doc for best fill.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
    settings:
      base:
        # Game Center is entitlement-gated: without this, GKLocalPlayer never
        # authenticates and every score/achievement submission is silently inert.
        CODE_SIGN_ENTITLEMENTS: TraceLine/Resources/TraceLine.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.defranceski.traceline
        PRODUCT_NAME: TraceLine
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing identity is supplied at archive time rather than hard-coded here:
        #   xcodebuild archive ... DEVELOPMENT_TEAM=<team> -allowProvisioningUpdates
        # Simulator builds need no signing and work without it.
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: SpriteKit.framework
      - sdk: GameKit.framework
      - sdk: StoreKit.framework
      - package: GoogleMobileAds

  TraceLineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TraceLineTests
    dependencies:
      - target: TraceLine
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

  TraceLineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TraceLineUITests
    dependencies:
      - target: TraceLine
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TraceLine:
    build:
      targets:
        TraceLine: all
        TraceLineTests: [test]
        TraceLineUITests: [test]
    test:
      targets: [TraceLineTests, TraceLineUITests]
    run:
      config: Debug
